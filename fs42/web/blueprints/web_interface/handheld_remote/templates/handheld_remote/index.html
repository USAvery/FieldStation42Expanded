{% extends 'base.html' %}
{% block viewport %}width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no{% endblock %}

{% block page_content %}
<div class="seven-seg" id="current-channel">--</div>
  <div id="network-name">Loading...</div>

  <div class="row">
    <button class="btn btn-flex" onclick="app.web_interface.handheld_remote.sendCommand('up')">
      <span class="arrow">▲</span>
      <span class="label">Channel Up</span>
    </button>
  </div>
  <div class="row">
    <button class="btn btn-flex" onclick="app.web_interface.handheld_remote.sendCommand('down')">
      <span class="arrow">▼</span>
      <span class="label">Channel Down</span>
    </button>
  </div>

  <div id="entry">_</div>
  <div class="row">
    <button class="btn btn-flex" onclick="app.web_interface.handheld_remote.openOnDemand()">On Demand</button>
  </div>

  <div class="keypad">
    <button class="btn" onclick="app.web_interface.handheld_remote.appendDigit(1)">1</button>
    <button class="btn" onclick="app.web_interface.handheld_remote.appendDigit(2)">2</button>
    <button class="btn" onclick="app.web_interface.handheld_remote.appendDigit(3)">3</button>
    <button class="btn" onclick="app.web_interface.handheld_remote.appendDigit(4)">4</button>
    <button class="btn" onclick="app.web_interface.handheld_remote.appendDigit(5)">5</button>
    <button class="btn" onclick="app.web_interface.handheld_remote.appendDigit(6)">6</button>
    <button class="btn" onclick="app.web_interface.handheld_remote.appendDigit(7)">7</button>
    <button class="btn" onclick="app.web_interface.handheld_remote.appendDigit(8)">8</button>
    <button class="btn" onclick="app.web_interface.handheld_remote.appendDigit(9)">9</button>
    <button class="btn" onclick="app.web_interface.handheld_remote.clearEntry()">C</button>
    <button class="btn" onclick="app.web_interface.handheld_remote.appendDigit(0)">0</button>
    <button class="btn" onclick="app.web_interface.handheld_remote.sendDirect(true)">Enter</button>
  </div>

  <div id="title"></div>
{% endblock page_content %}
