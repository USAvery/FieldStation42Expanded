{% extends 'index.html' %}
{% block head %}
<title>FieldStation42 TV Remote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="/static/remote.css">
{% endblock %}
{% block content %}
<div class="seven-seg" id="current-channel">--</div>
  <div id="network-name">Loading...</div>

  <div class="row">
    <button class="btn btn-flex" onclick="app.tools.handheld_remote.sendCommand('up')">
      <span class="arrow">▲</span>
      <span class="label">Channel Up</span>
    </button>
  </div>
  <div class="row">
    <button class="btn btn-flex" onclick="app.tools.handheld_remote.sendCommand('down')">
      <span class="arrow">▼</span>
      <span class="label">Channel Down</span>
    </button>
  </div>

  <div id="entry">_</div>

  <div class="keypad">
    <button class="btn" onclick="app.tools.handheld_remote.appendDigit(1)">1</button>
    <button class="btn" onclick="app.tools.handheld_remote.appendDigit(2)">2</button>
    <button class="btn" onclick="app.tools.handheld_remote.appendDigit(3)">3</button>
    <button class="btn" onclick="app.tools.handheld_remote.appendDigit(4)">4</button>
    <button class="btn" onclick="app.tools.handheld_remote.appendDigit(5)">5</button>
    <button class="btn" onclick="app.tools.handheld_remote.appendDigit(6)">6</button>
    <button class="btn" onclick="app.tools.handheld_remote.appendDigit(7)">7</button>
    <button class="btn" onclick="app.tools.handheld_remote.appendDigit(8)">8</button>
    <button class="btn" onclick="app.tools.handheld_remote.appendDigit(9)">9</button>
    <button class="btn" onclick="app.tools.handheld_remote.clearEntry()">C</button>
    <button class="btn" onclick="app.tools.handheld_remote.appendDigit(0)">0</button>
    <button class="btn" onclick="app.tools.handheld_remote.sendDirect(true)">Enter</button>
  </div>

  <div id="title"></div>
<script src="/static/remote.js"></script>
<script>app.tools.handheld_remote.setup();</script>
{% endblock %}
