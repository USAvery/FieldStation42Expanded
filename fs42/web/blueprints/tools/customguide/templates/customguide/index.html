{% extends 'index.html' %}
{% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Guide</title>
    <link rel="stylesheet" href="customguide.css">
    <script src="/static/utils/routing.js"></script>
    <script src="/static/utils/general.js"></script>
{% endblock %}

{% block body_attributes %}{% endblock %}
{% block content %}
    <!-- Program Details and Live Preview -->
    <div id="guide-wrapper">
        <div id="guide-listings">
            <div id="top-panel">
                <div id="text-panel">
                    <div class="xfinity-brand-strip">
                        <div class="comcast-logo"><img src="images/comcast_logo.png" alt="Comcast"></div>
                        <div class="xfinity-listings-block">
                            <div class="xfinity-listings-title">TV Listings</div>
                            <div class="xfinity-clock-line">
                                <span id="clock"></span>
                            </div>
                        </div>
                        <div class="tv-guide-badge" aria-label="TV Guide">
                            <img src="images/tv_guide_logo.png" alt="TV Guide">
                        </div>
                    </div>
                    <div class="xfinity-program-details">
                        <div class="xfinity-program-heading">
                            <div id="selected-program-title">Program Title</div>
                            <div id="selected-channel-label"></div>
                        </div>
                        <div class="xfinity-program-subrow">
                            <div id="selected-program-time"></div>
                            <div id="selected-program-icons">
                            </div>
                        </div>
                        <div id="selected-program-description"></div>
                    </div>
                </div>
                <div id="video-panel" aria-label="Current channel preview"></div>
            </div>
            <div id="grid-wrapper">
                <div id="grid-header">
                    <div class="grid-channel-stub">
                        <span class="xfinity-today">Today</span>
                        <span class="xfinity-prev-arrow" aria-hidden="true"></span>
                        <div class="clock-icon">
                            <img src="images/clock_icon.png" alt="">
                        </div>
                    </div>
                </div>
                <div id="grid-listings"></div>
            </div>
            <div id="guide-promo" aria-hidden="true">
            </div>
        </div>
    </div>
    <!-- Embedded JavaScript -->
    <script src="customguide.js"></script>
    <script>app.tools.customguide.setup();</script>
{% endblock %}
