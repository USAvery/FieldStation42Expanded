{% extends 'index.html' %}
{% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comcast On Demand</title>
    <link rel="stylesheet" href="/static/tools/on_demand/on_demand.css">
    <script src="/static/utils/routing.js"></script>
{% endblock %}
{% block content %}
    <main id="od-wrapper" aria-label="On Demand">
        <!-- Branding, Selection Details, and Native Channel Preview -->
        <header id="od-top">
            <div id="od-info">
                <div id="od-brand">
                    <img src="/static/tools/customguide/images/comcast_logo.png" alt="Comcast">
                    <time id="od-clock"></time>
                </div>
                <div id="od-heading">
                    <h1><span class="od-mark" aria-hidden="true">OD</span> On Demand</h1>
                    <p id="od-selection">Top Picks</p>
                </div>
            </div>
            <div id="video-panel" aria-label="Current channel preview"></div>
        </header>
        <!-- Library Categories, Results, and Playback Details -->
        <section id="od-content" aria-label="Library">
            <div id="od-search" hidden>
                <label for="od-query">Search titles</label>
                <input id="od-query" type="search" maxlength="200" autocomplete="off">
            </div>
            <div id="od-details" hidden>
                <h2 id="od-title"></h2>
                <p id="od-meta"></p>
                <p id="od-description"></p>
            </div>
            <div id="od-status" role="status" aria-live="polite"></div>
            <div id="od-options" aria-label="Choices"></div>
        </section>
        <nav id="od-navigation" aria-label="Menu navigation"></nav>
        <footer id="od-footer" aria-hidden="true"></footer>
    </main>
    <!-- Embedded JavaScript -->
    <script src="/static/tools/on_demand/on_demand.js"></script>
    <script>app.tools.on_demand.setup();</script>
{% endblock %}
