{% macro log_display(prefix) %}
<div id="{{ prefix }}-log-frame" class="log-container" style="display:none;">
    <div class="log-header">
        <h2 id="{{ prefix }}-log-header">Log</h2>
        <button id="{{ prefix }}-log-dismiss" class="pure-button">Dismiss</button>
    </div>
    <pre id="{{ prefix }}-log" class="fs42-terminal"></pre>
</div>
{% endmacro %}
