<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>{{ code }} — {{ title }}</title></head>
<body>
    <main role="main">
        <h1>{{ code }} — {{ title }}</h1>
        <p role="alert">{{ message }}</p>
        {% if details %}<details><summary>Debug details</summary><pre>{{ details }}</pre></details>{% endif %}
    </main>
</body>
</html>
